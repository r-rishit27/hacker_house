# nginx in front of uvicorn. Install to /etc/nginx/sites-available/sentinel,
# symlink into sites-enabled, then run certbot against it:
#
#   sudo ln -sf /etc/nginx/sites-available/sentinel /etc/nginx/sites-enabled/sentinel
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.example.com
#
# Certbot rewrites the server block below in place, adding the listen 443,
# the certificate paths and the port-80 redirect. Everything here that matters
# — the proxy settings, and the SSE block — it leaves alone.
#
# Why TLS is not optional: Amplify serves the console over HTTPS, and a page
# served over HTTPS may not call http://<ec2-ip>:8000. The browser blocks it
# as mixed content before the request is sent, and the console shows a
# disconnected badge with nothing in the network tab to explain it. Without a
# domain of your own, `<public-ip>.sslip.io` resolves to that IP from
# anywhere and certbot will issue for it — see deploy/README.md.

upstream sentinel_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name API_DOMAIN_HERE;

    # The agent's answers are small; a request body is an action payload of a
    # few hundred bytes. 1 MB is already ten times anything legitimate.
    client_max_body_size 1m;

    # nginx's default is to strip these and they are worth having: without
    # them the API's problem bodies build their hrefs from the loopback host
    # uvicorn sees rather than the name the caller used.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # CORS is answered by the application, not here. The API already knows
    # which origins it serves, which methods it allows and which headers a
    # reconnecting EventSource needs; a second set of headers added by nginx
    # would produce two Access-Control-Allow-Origin values, which every
    # browser treats as none.

    # ── the run stream ───────────────────────────────────────────────────────
    # The console holds an EventSource open on this for the length of a run.
    # Three things have to be off or the stream arrives as one burst at the
    # end, which is indistinguishable from an agent that has hung:
    #   proxy_buffering  — nginx would hold events until a buffer filled
    #   gzip             — the gzip filter buffers to find something to
    #                      compress, and an SSE frame is too small to give it
    #                      one
    #   proxy_read_timeout — a run is quiet between steps; the default 60 s
    #                      would cut it mid-investigation
    # The application also sends `X-Accel-Buffering: no` on this response, so
    # this block is belt and braces — but it is the belt that survives someone
    # adding `gzip on` to nginx.conf later.
    location ~ ^/api/investigations/.+/events$ {
        proxy_pass http://sentinel_api;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # ── everything else ──────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://sentinel_api;
        # A cold TigerGraph workspace takes about 45 seconds to wake and the
        # first call after idle pays all of it. 120 s matches the backend's
        # own tg_query_timeout_s, so the proxy is never the thing that gives
        # up first — a 504 from nginx tells the console nothing, while the
        # API's own timeout comes back as problem+json that names the graph.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # An uptime check that does not wake the graph or touch the API. When this
    # answers and /api/health does not, the fault is the service, not the box.
    location = /_edge/health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Nothing else is served from this host: the console is on Amplify. Saying
    # so beats a 502 from a proxy pass that had nowhere to go.
    location / {
        return 404 "Sentinel API. The console is deployed separately; the API is under /api.\n";
        default_type text/plain;
    }

    access_log /var/log/nginx/sentinel.access.log;
    error_log  /var/log/nginx/sentinel.error.log warn;
}
