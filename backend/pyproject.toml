[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-backend"
version = "2.0.0"
description = "Sentinel — agentic fraud investigation on TigerGraph"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "openai>=1.40",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # [asyncio] pulls in greenlet, without which every async SQLAlchemy call
    # fails with "the greenlet library is required" at the first await.
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# The offline ETL and the one-shot loader scripts. Not on the agent's hot path.
scripts = ["pyTigerGraph>=1.6", "duckdb>=1.0", "pandas>=2.2", "python-dotenv>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["sentinel*", "api*"]

[tool.setuptools.package-data]
"sentinel.evidence" = ["elt.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: hits the live TigerGraph workspace; excluded from CI with -m 'not live'",
]
filterwarnings = ["error::DeprecationWarning:sentinel.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "BLE"]
ignore = [
    "ANN401",  # typing.Any is legitimate at the TigerGraph boundary
    "E501",    # line length is handled by the formatter
    # `class Action(str, Enum)` rather than StrEnum, deliberately: StrEnum changes
    # what str(member) returns, and the ported v1 tests pass bare strings through
    # the same call sites as enum members. Revisit once nothing passes strings.
    "UP042",
    # En dashes in prose docstrings are house style, not a typo.
    "RUF002",
]

[tool.ruff.lint.flake8-bugbear]
# `Query(...)`, `Path(...)` and friends in a default are FastAPI's declaration
# syntax, not a mutable default. Ruff special-cases them on a decorated route
# and cannot see ours, which bind through `add_api_route` so the route table
# stays a value the controller returns (LLD 1316).
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "B011"]

[tool.mypy]
python_version = "3.12"  # the venv; numpy stubs need >= 3.12
strict = true
packages = ["sentinel", "api"]
warn_unreachable = true
# TigerGraph and OpenAI responses arrive untyped; the boundary classes narrow them.
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = ["pyTigerGraph.*", "duckdb.*"]
ignore_missing_imports = true
